spring.application.name=jnvst-guru-backend
spring.config.import=optional:file:./local.properties

server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.schemas=application
spring.flyway.locations=classpath:db/migration

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER:https://eolupxlsxwpmaqfyyeqo.supabase.co/auth/v1}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI:https://eolupxlsxwpmaqfyyeqo.supabase.co/auth/v1/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

google.drive.enabled=${GOOGLE_DRIVE_ENABLED:false}
google.drive.credentials-json=${GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:}
spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.com.jnvstguru.jnvst_guru_backend=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO
logging.level.org.springframework.web=INFO
logging.file.name=logs/jnvst-guru-backend.log
logging.file.path=logs
logging.pattern.console=
logging.console.enabled=false
